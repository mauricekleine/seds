# Three days gives compromised releases time to be reported and withdrawn.
minimumReleaseAge: 4320
# Native/compiler installers already required by the existing Remix build.
onlyBuiltDependencies:
  - deasync
  - esbuild
  - unrs-resolver
# Contentful's postinstall only advertises its next major release.
ignoredBuiltDependencies:
  - contentful
# Exact transitive pins in these parents otherwise prevent security patches.
# Remove each override when its parent accepts the patched version.
overrides:
  '@vercel/node@2>path-to-regexp': ^6.3.0
  '@vercel/static-config@2>ajv': ^8.18.0
  'lint-staged@13>yaml': ^2.9.1
  # cacache 15 pins unmaintained tar 6. Remove when Remix upgrades cacache.
  # tar 7 requires Node >=18; this app runs Node 24.
  'cacache@15>tar': 7.5.22
  # remark-mdx-frontmatter 1 pins vulnerable toml 3. Remove when Remix updates it.
  # TOML 5 rejects unsafe integers; authored MDX uses ordinary metadata values.
  'remark-mdx-frontmatter@1>toml': 5.0.1
  # get-uri 6 pins basic-ftp 5. Remove when proxy-agent's get-uri accepts 6.
  # FTP 6 retains Client.downloadTo and blocks separate transfer hosts by default.
  'get-uri@6>basic-ftp': 6.2.3
